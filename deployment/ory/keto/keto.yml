# Ory Keto configuration for the ReferralAI authorization model (API Contract v1.3 §2).
# Owned by tenant-service — the namespace set mirrors src/common/auth/authz/permission-catalog.ts.
# Mount ./namespaces at /etc/config/keto_namespaces. The DSN comes from the environment (DSN=...).
serve:
  read:
    host: 0.0.0.0
    port: 4466
  write:
    host: 0.0.0.0
    port: 4467

namespaces: file:///etc/config/keto_namespaces
